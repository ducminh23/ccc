name: Run Node and Python

on:
  workflow_dispatch:        # bấm chạy tay
  schedule:
    - cron: "*/30 * * * *"  # chạy mỗi 30 phút (giờ UTC)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: |
          [ -f package.json ] && npm install || true
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Chạy Node.js
        run: node app.js

      - name: Chạy Python
        run: python main.py
