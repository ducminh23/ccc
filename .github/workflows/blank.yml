name: Run Node and Python

on:
  workflow_dispatch:
    inputs:
      param1:
        description: "Tham số 1"
        required: true
      param2:
        description: "Tham số 2"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Chạy Node.js
        env:
          PARAM1: ${{ inputs.param1 }}
          PARAM2: ${{ inputs.param2 }}
        run: node app.js
